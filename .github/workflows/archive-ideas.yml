# Keeps data/ideas_history/ up to date for the Journal tab: whenever the morning
# research job pushes a new data/ideas.json to main, save a dated copy of it.
name: Archive daily ideas

on:
  push:
    branches: [main]
    paths: [data/ideas.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-ideas
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Save a dated copy of today's ideas
        run: python tools/archive_ideas.py
      - name: Commit it if it's new or changed
        run: |
          git add data/ideas_history
          if git diff --cached --quiet; then
            echo "Nothing new to archive."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive daily ideas for $(python -c "import json; print(json.load(open('data/ideas.json'))['date'])")"
          git pull --rebase origin main
          git push origin HEAD:main
